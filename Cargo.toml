[package]
name = "dyncall"
version = "0.1.0"
edition = "2021"
description = "Call functions in dynamic libraries at runtime without compile-time signature knowledge. Wraps libffi for scripting language interpreters and other dynamic dispatch use cases."
license = "MIT"
repository = "https://github.com/pm100/dyncall"
keywords = ["ffi", "libffi", "dynamic", "scripting", "interop"]
categories = ["api-bindings", "external-ffi-bindings"]

[dependencies]
anyhow = "1.0.81"
enum-as-inner = "0.6.1"
libc = "0.2.153"
libffi = "4.1.2"
log = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "file_copy"
harness = false
